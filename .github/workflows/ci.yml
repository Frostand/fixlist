# Required checks from AGENTS.md. A red step is a failure; nothing here deploys, uploads or publishes.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # Both suites call the scan helpers through scan/venv-python, which reads FIXLIST_SCAN_PYTHON.
      - run: python -m pip install -r scan/requirements.txt
      - run: echo "FIXLIST_SCAN_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: scan/venv-python -m unittest discover -s scan/tests
