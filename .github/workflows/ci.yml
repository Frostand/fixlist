# Required checks from AGENTS.md. A red step is a failure; nothing here deploys, uploads or publishes.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # The unit suite needs only numpy and pillow; pycolmap is imported lazily by the reconstruction stages.
      - run: python -m pip install numpy==2.5.4 pillow==13.0.0
      - run: FIXLIST_SCAN_PYTHON="$(command -v python)" scan/venv-python -m unittest discover -s scan/tests
