// ---------- story data ----------

const A = [

  { phone: 'A', at: 36.45, shot: 'rate', target: 'send' },

const COPY = [
  { t0: 8.3, t1: 12.0, eyebrow: 'For older adults', h1: 'Just say what you need.', sub: 'Talk, type, or tap. In any of nine languages.' },
  { t0: 12.2, t1: 17.2, eyebrow: 'On-device AI', h1: 'It writes the job for you.', sub: 'The tools, skills and time are drafted on the phone. She checks it, then posts.' },
  { t0: 17.4, t1: 20.0, eyebrow: 'Private by default', h1: 'Posted in one tap.', sub: 'Her exact address stays hidden until a volunteer accepts.' },
  { t0: 20.2, t1: 24.3, eyebrow: 'Room check', h1: 'Or show us the spot.', sub: 'The camera flags possible hazards. She decides what becomes a request.' },

  { t0: 33.6, t1: 36.6, eyebrow: 'Back to Margaret', h1: 'Done when she says it’s done.', sub: 'She confirms the job and thanks Jordan.' },
  { t0: 36.9, t1: 40.2, eyebrow: 'Built to last', h1: 'Real hours. Every language.', sub: 'Confirmed help builds a volunteer’s record. Soon-ja uses FixList in Korean.' },
];
const CHIPS = [
  { t0: 13.4, t1: 16.6, x: 1560, y: 330, text: 'Ladder', icon: 'tool' },
  { t0: 13.8, t1: 16.6, x: 1560, y: 420, text: 'Basic electrical', icon: 'check' },
  { t0: 14.2, t1: 16.6, x: 1560, y: 510, text: 'About 20 minutes', icon: 'clock' },
  { t0: 18.0, t1: 20.0, x: 1560, y: 470, text: 'Address stays private', icon: 'lock' },
  { t0: 26.8, t1: 29.8, x: 1560, y: 330, text: 'Strong match', icon: 'star', green: true },
  { t0: 27.1, t1: 29.8, x: 1560, y: 420, text: 'Free Sat morning', icon: 'clock' },
  { t0: 27.4, t1: 29.8, x: 1560, y: 510, text: 'Has the tools', icon: 'tool' },
  { t0: 31.9, t1: 33.4, x: 1560, y: 470, text: 'Directions in Maps', icon: 'pin' },

  { id: 'labelA', t0: 24.6, t1: 33.4, html: '<b>Jordan</b> · volunteer' },
  { id: 'labelA', t0: 33.6, t1: 36.7, html: '<b>Margaret</b>' },
  { id: 'labelA', t0: 36.9, t1: 40.3, html: '<b>Jordan</b> · profile' },
  { id: 'labelB', t0: 37.1, t1: 40.3, html: '<b>Soon-ja</b> · in Korean' },

let META;
const layerCache = new Map();
function layerFor(screen, seg) {
  const key = screen.id + seg.shot;
  if (layerCache.has(key)) return layerCache.get(key);
  const m = META.shots[seg.shot], el = document.createElement('div'); el.className = 'layer';
  const page = document.createElement('img'); page.className = 'page'; page.src = SHOTS + seg.shot + '.png'; page.style.top = STATUS_TOP + 'px'; el.appendChild(page);
  if (m.full && m.tabs) { const tabs = document.createElement('img'); tabs.className = 'tabs'; tabs.src = SHOTS + seg.shot + '-tabs.png'; tabs.style.top = (STATUS_TOP + m.tabs.y) + 'px'; el.appendChild(tabs); }
  el.style.opacity = 0; screen.insertBefore(el, screen.firstChild); layerCache.set(key, { el, page });
  return layerCache.get(key);
}
function scrollAt(seg, t) {
  const k = seg.scroll; if (!k.length) return 0;
  if (t <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) if (t <= k[i][0]) return k[i - 1][1] + (k[i][1] - k[i - 1][1]) * inOut(prog(t, k[i - 1][0], k[i][0]));
  return k.at(-1)[1];
}
function renderPhone(screen, segs, t) {
  for (const { el } of layerCache.values()) if (el.parentNode === screen) el.style.opacity = 0;
  segs.forEach((seg, i) => {
    if (t < seg.t0 - 0.01 || t > seg.t1 + 0.35) return;
    const L = layerFor(screen, seg), fadeIn = i === 0 ? 1 : outCubic(prog(t, seg.t0, seg.t0 + 0.3)), fadeOut = t > seg.t1 ? 1 - prog(t, seg.t1, seg.t1 + 0.3) : 1;
    L.el.style.opacity = Math.min(fadeIn, fadeOut); L.el.style.zIndex = i;

  });

function renderTap(tapEl, phone, segs, t) {
  tapEl.style.opacity = 0;
  for (const tap of TAPS) {
    if (tap.phone !== phone || t < tap.at - 0.05 || t > tap.at + 0.55) continue;
    const seg = segs.find((s) => s.shot === tap.shot), r = META.shots[tap.shot].rects[tap.target]; if (!seg || !r) continue;
    const p = prog(t, tap.at - 0.05, tap.at + 0.55), scale = 0.55 + 0.75 * outCubic(p);

function words(el, text) { el.innerHTML = text.split(' ').map((w) => `<span class="w"><span class="wi">${w}</span></span>`).join(' '); return [...el.querySelectorAll('.wi')]; }

// build copy blocks and chips once
const copyEls = COPY.map((c) => { const d = document.createElement('div'); d.className = 'copy'; d.innerHTML = `<div class="eyebrow">${c.eyebrow}</div><div class="h1"></div><div class="sub">${c.sub}</div>`; $('copies').appendChild(d); return { d, words: words(d.querySelector('.h1'), c.h1), eyebrow: d.querySelector('.eyebrow'), sub: d.querySelector('.sub') }; });
const chipEls = CHIPS.map((c) => { const d = document.createElement('div'); d.className = 'chip' + (c.green ? ' green' : ''); d.innerHTML = `<i><svg viewBox="0 0 24 24">${icon[c.icon]}</svg></i>${c.text}`; d.style.left = c.x + 'px'; d.style.top = c.y + 'px'; $('chips').appendChild(d); return d; });

window.renderAt = (t) => {

  $('blob1').style.transform = `translate(${Math.sin(t / 6) * 60}px, ${Math.cos(t / 7) * 40}px)`;
  $('blob2').style.transform = `translate(${Math.cos(t / 5) * 50}px, ${Math.sin(t / 8) * 50}px)`;

  for (const seg of [...A, ...B]) layerFor(seg === B[0] ? $('screenB') : $('screenA'), seg);
  await document.fonts.ready;
  await Promise.all([...document.images].map((img) => img.complete ? null : new Promise((r) => { img.onload = img.onerror = r; })));
  window.renderAt(0);
  return true;
};
</script>
